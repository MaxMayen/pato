<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Patoooooooooooooo</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Arial Black', sans-serif;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        #player {
            width: 100vw;
            height: 56.25vw;
            min-height: 100vh;
            min-width: 177.77vh;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .controls {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 10;
        }

        #unmuteButton {
            background: #fff;
            color: #000;
            border: 4px solid #000;
            padding: 15px 25px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 8px 8px 0px #ff0055;
            text-transform: uppercase;
            transition: 0.2s;
        }

        #unmuteButton:active {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0px #000;
        }
    </style>
</head>
<body>

    <div class="video-background">
        <div id="player"></div>
    </div>

    <div class="controls">
        <button id="unmuteButton">ACTIVAR SONIDO 🔊</button>
    </div>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'MCgKK0Pb0QQ',
                playerVars: {
                    'autoplay': 1,
                    'mute': 1,
                    'loop': 1,
                    'playlist': '8Ewzyezot3s',
                    'controls': 0,
                    'showinfo': 0,
                    'rel': 0,
                    'modestbranding': 1
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            event.target.playVideo();
        }

        document.getElementById('unmuteButton').addEventListener('click', function() {
            if (player.isMuted()) {
                player.unMute();
                this.innerText = "SILENCIAR 🔇";
            } else {
                player.mute();
                this.innerText = "ACTIVAR SONIDO 🔊";
            }
        });
    </script>

</body>
</html>
