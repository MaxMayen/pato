<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Patoooooooo</title>
    <style>
        body, html {
                <!--"NI YO SE COMO FUNCIONA ESTO"-->
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #000;
        }

        #player {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        @media (min-aspect-ratio: 16/9) {
            #player { height: 56.25vw; }
        }

        @media (max-aspect-ratio: 16/9) {
            #player { width: 177.78vh; }
        }

        .controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
        }

        button {
            padding: 15px 25px;
            cursor: pointer;
            font-weight: bold;
            font-family: sans-serif;
            background: #fff;
            border: 4px solid #000;
            box-shadow: 8px 8px 0px #ff0055;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="video-background">
        <div id="player"></div>
    </div>

    <div class="controls">
        <button id="unmuteButton">ACTIVAR AUDIO 🔊</button>
    </div>

    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: 'KC5TvP5XJ64',
                playerVars: {
                    'autoplay': 1,
                    'mute': 1,
                    'loop': 1,
                    'playlist': 'KC5TvP5XJ64',
                    'controls': 0,
                    'showinfo': 0,
                    'rel': 0,
                    'modestbranding': 1,
                    'iv_load_policy': 3,
                    'enablejsapi': 1
                },
                events: {
                    'onReady': function(e) {
                        e.target.playVideo();
                    }
                }
            });
        }

        document.getElementById('unmuteButton').onclick = function() {
            if (player.isMuted()) {
                player.unMute();
                this.innerText = "SILENCIAR 🔇";
            } else {
                player.mute();
                this.innerText = "ACTIVAR AUDIO 🔊";
            }
        };
    </script>
</body>
</html>
